global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aqi-prediction-api"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["aqi-api:8000", "localhost:8000", "host.docker.internal:8000"]
        labels:
          app: "aqi-prediction-api"
          environment: "production"

  - job_name: "prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]
